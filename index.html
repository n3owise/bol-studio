<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Turn your Hindi and Hinglish videos into word-perfect, animated captions. A local caption studio for creators." />

    <!-- Favicon & App Icons -->
    <link rel="shortcut icon" href="/favicon.ico?v=bol4" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=bol4" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=bol4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=bol4" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=bol4" />
    <link rel="icon" type="image/png" href="/favicon.png?v=bol4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=bol4" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg?v=bol4" color="#2ee368" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=bol4" />
    <link rel="manifest" href="/site.webmanifest?v=bol4" />

    <!-- Zero-flash theme initialization -->
    <script>
      (function() {
        try {
          // Light unless this browser has been told otherwise. The machine's
          // preference is deliberately not consulted: the studio is a light
          // product by default, and the sign-in screen it opens behind is light
          // unconditionally, so following the OS here meant the page changed
          // colour the moment somebody logged in.
          var saved = localStorage.getItem('bol_theme');
          var theme = saved === 'dark' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('theme-dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#111215');
          }
        } catch (e) {}
      })();
    </script>

    <title>Bol — Hinglish caption studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
